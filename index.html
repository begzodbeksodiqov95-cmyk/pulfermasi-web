<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>VideoUZ</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        #feed {
            width: 100%;
            height: calc(100% - 65px);
            position: relative;
            overflow: hidden;
        }

        .video {
            position: absolute;
            inset: 0;
            display: none;
            background: #111;
        }

        .video.active {
            display: block;
        }

        .video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info {
            position: absolute;
            left: 15px;
            bottom: 25px;
            color: white;
            z-index: 2;
            text-shadow: 0 1px 5px #000;
        }

        .username {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .caption {
            font-size: 15px;
        }

        .actions {
            position: absolute;
            right: 12px;
            bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 3;
        }

        .action {
            color: white;
            text-align: center;
            font-size: 28px;
            text-shadow: 0 1px 5px #000;
        }

        .action span {
            display: block;
            font-size: 12px;
            margin-top: 3px;
        }

        .bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav {
            color: #aaa;
            font-size: 11px;
            text-align: center;
        }

        .nav.active {
            color: white;
        }

        .icon {
            display: block;
            font-size: 22px;
            margin-bottom: 2px;
        }

        .upload {
            width: 46px;
            height: 36px;
            border-radius: 10px;
            background: white;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
        }
    </style>
</head>

<body>

<div id="app">

    <div id="feed">

        <!-- 1-VIDEO -->
        <div class="video active">

            <video
                src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                autoplay
                muted
                loop
                playsinline>
            </video>

            <div class="info">
                <div class="username">@video_uz</div>
                <div class="caption">Birinchi video 🎬</div>
            </div>

            <div class="actions">
                <div class="action">
                    ❤️
                    <span>0</span>
                </div>

                <div class="action">
                    💬
                    <span>0</span>
                </div>

                <div class="action">
                    ↗️
                    <span>Ulashish</span>
                </div>
            </div>

        </div>


        <!-- 2-VIDEO -->
        <div class="video">

            <video
                src="https://www.w3schools.com/html/mov_bbb.mp4"
                muted
                loop
                playsinline>
            </video>

            <div class="info">
                <div class="username">@video_uz</div>
                <div class="caption">Ikkinchi video 🔥</div>
            </div>

            <div class="actions">
                <div class="action">
                    ❤️
                    <span>0</span>
                </div>

                <div class="action">
                    💬
                    <span>0</span>
                </div>

                <div class="action">
                    ↗️
                    <span>Ulashish</span>
                </div>
            </div>

        </div>

    </div>


    <!-- PASTKI MENYU -->

    <div class="bottom">

        <div class="nav active">
            <span class="icon">🏠</span>
            Bosh sahifa
        </div>

        <div class="nav">
            <span class="icon">🔥</span>
            Reels
        </div>

        <div class="nav">
        <label class="upload" for="videoPicker">＋</label>
<input id="videoPicker" type="file" accept="video/*" style="display:none">
        </div>

        <div class="nav">
            <span class="icon">💬</span>
            Chat
        </div>

        <div class="nav">
            <span class="icon">👤</span>
            Profil
        </div>

    </div>

</div>


<script src="script.js"></script>
<script>
const picker = document.getElementById("videoPicker");

picker.addEventListener("change", function() {
    const file = this.files[0];

    if (!file) return;

    const url = URL.createObjectURL(file);

    const video = document.createElement("video");
    video.src = url;
    video.controls = true;
    video.autoplay = true;
    video.muted = true;
    video.loop = true;

    video.style.width = "100%";
    video.style.height = "100%";
    video.style.objectFit = "cover";

    document.getElementById("feed").appendChild(video);
});
</script>
</body>
</html>
