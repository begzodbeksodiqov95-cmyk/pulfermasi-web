<!DOCTYPE html>
<html lang="uz">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>VideoUZ</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#app{
    width:100%;
    height:100%;
    background:#000;
    position:relative;
}

#feed{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:calc(100% - 65px);
    overflow:hidden;
}

.video{
    position:absolute;
    inset:0;
    display:none;
    background:#111;
}

.video.active{
    display:block;
}

.video video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

.info{
    position:absolute;
    left:15px;
    bottom:25px;
    color:white;
    z-index:5;
    text-shadow:0 1px 5px #000;
}

.username{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.caption{
    font-size:15px;
}

.actions{
    position:absolute;
    right:12px;
    bottom:25px;
    display:flex;
    flex-direction:column;
    gap:20px;
    z-index:5;
}

.action{
    color:white;
    text-align:center;
    font-size:28px;
    text-shadow:0 1px 5px #000;
}

.action span{
    display:block;
    font-size:12px;
}

.bottom{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#000;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:20;
}

.nav{
    color:#aaa;
    font-size:11px;
    text-align:center;
}

.nav.active{
    color:white;
}

.icon{
    display:block;
    font-size:22px;
    margin-bottom:2px;
}

.upload{
    width:46px;
    height:36px;
    border-radius:10px;
    background:white;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

#videoPicker{
    display:none;
}

</style>

</head>


<body>

<div id="app">

    <div id="feed"></div>


    <div class="bottom">

        <div class="nav active">

            <span class="icon">🏠</span>

            Bosh sahifa

        </div>


        <div class="nav">

            <span class="icon">🔥</span>

            Reels

        </div>


        <div class="nav">

            <label
                class="upload"
                for="videoPicker">

                ＋

            </label>

        </div>


        <div class="nav">

            <span class="icon">💬</span>

            Chat

        </div>


        <div class="nav">

            <span class="icon">👤</span>

            Profil

        </div>

    </div>

</div>


<input
    id="videoPicker"
    type="file"
    accept="video/*">


<script src="script.js"></script>

</body>

</html>
