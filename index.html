<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>VideoUZ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
    }

    .reels {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .video {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    .video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      position: absolute;
      left: 15px;
      bottom: 90px;
      color: white;
      z-index: 3;
      text-shadow: 0 1px 4px #000;
    }

    .username {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .caption {
      font-size: 15px;
      max-width: 280px;
    }

    .actions {
      position: absolute;
      right: 12px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      z-index: 3;
    }

    .action {
      color: white;
      text-align: center;
      font-size: 28px;
      cursor: pointer;
      text-shadow: 0 1px 5px #000;
    }

    .action span {
      display: block;
      font-size: 12px;
      margin-top: 3px;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .nav {
      color: #aaa;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
    }

    .nav .icon {
      display: block;
      font-size: 23px;
      margin-bottom: 2px;
    }

    .nav.active {
      color: white;
    }

    .upload {
      width: 48px;
      height: 38px;
      border-radius: 12px;
      background: white;
      color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 25px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="reels">

    <div class="video">
      <video
        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
        autoplay
        muted
        loop
        playsinline>
      </video>

      <div class="info">
        <div class="username">@video_uz</div>
        <div class="caption">Bizning birinchi video platformamiz 🎬🔥</div>
      </div>

      <div class="actions">
        <div class="action" onclick="like(this)">
          ❤️
          <span>0</span>
        </div>

        <div class="action">
          💬
          <span>0</span>
        </div>

        <div class="action">
          ↗️
          <span>Ulashish</span>
        </div>
      </div>
    </div>

  </div>

  <div class="bottom">

    <div class="nav active">
      <span class="icon">🏠</span>
      Bosh sahifa
    </div>

    <div class="nav">
      <span class="icon">🔥</span>
      Reels
    </div>

    <div class="nav">
      <div class="upload">＋</div>
    </div>

    <div class="nav">
      <span class="icon">💬</span>
      Chat
    </div>

    <div class="nav">
      <span class="icon">👤</span>
      Profil
    </div>

  </div>

</div>

<script>
  function like(element) {
    const number = element.querySelector("span");

    if (element.dataset.liked === "true") {
      element.dataset.liked = "false";
      number.textContent = "0";
    } else {
      element.dataset.liked = "true";
      number.textContent = "1";
    }
  }
</script>

</body>
</html>
